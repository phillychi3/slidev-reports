packages:
  - reports/**
  - "!dist/**"

# @comark/markdown-it 只支援 markdown-it 14；15.0.2 加了 exports 限制會讓 slidev build 失敗。
# overrides 管不到 pnpm 自動補裝的 peer，所以另外替 @slidev/cli 補上 markdown-it 14。
overrides:
  markdown-it: ^14.1.0

packageExtensions:
  '@slidev/cli@53':
    dependencies:
      markdown-it: ^14.1.0
